<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Video to Blog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            display: block;
            margin-top: 5px;
            color: #dc2626;
            font-size: 13px;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .bottom-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">Video to Blog Content</div>

        <h2>Create Your Account</h2>

        <p class="subtitle">
            Create an account to generate blog content from videos
        </p>

        <form id="register-form">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="reg-name"
                    placeholder="Enter your full name"
                    required
                >

                <span
                    id="reg-name-error"
                    class="error-message">
                </span>

            </div>

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="reg-email"
                    placeholder="Enter your email"
                    required
                >

                <span
                    id="reg-email-error"
                    class="error-message">
                </span>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="reg-password"
                    placeholder="Create a password"
                    required
                >

                <span
                    id="reg-password-error"
                    class="error-message">
                </span>

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="reg-confirm-password"
                    placeholder="Confirm your password"
                    required
                >

                <span
                    id="reg-confirm-password-error"
                    class="error-message">
                </span>

            </div>

            <button
                type="submit"
                id="register-submit-btn">
                Register
            </button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

    <script src="app.js"></script>
    <script src="auth.js"></script>

</body>

</html>
