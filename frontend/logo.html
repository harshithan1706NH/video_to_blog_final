<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Blog Content</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 24px;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-page {
            width: 100%;
            max-width: 900px;
            padding: 40px;
            text-align: center;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .logo-page img {
            display: block;
            width: 100%;
            max-width: 750px;
            height: auto;
            margin: 0 auto 24px;
            object-fit: contain;
        }

        .logo-page h1 {
            margin-bottom: 12px;
            color: #1e293b;
            font-size: 30px;
        }

        .logo-page p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
        }

        .start-button {
            display: inline-block;
            margin-top: 26px;
            padding: 13px 26px;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
        }

        .start-button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            .logo-page {
                padding: 24px 18px;
            }

            .logo-page h1 {
                font-size: 24px;
            }

            .logo-page p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="logo-page">
        <img src="assets/logo-icon.png" alt="Video Blog Content Logo">

        <h1>Video Blog Content</h1>

        <p>Turn videos into structured blog content automatically.</p>

        <a href="login.html" class="start-button">Get Started</a>
    </main>
</body>
</html>
