<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video to Blog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-page {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .logo-page img {
            width: 300px;
            height: auto;
            display: block;
            margin: 0 auto 25px;
        }

        .logo-page h1 {
            font-size: 28px;
            color: #222;
            margin-bottom: 10px;
        }

        .logo-page p {
            color: #777;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="logo-page">

        <img src="assets/logo.png" alt="Video to Blog Logo">

        <h1>Video to Blog</h1>

        <p>Turn videos into structured blog content</p>

    </div>

</body>

</html>
