<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Video to Blog Content</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-page-container">
        <section class="auth-card">

            <header class="auth-header">
                <a href="logo.html"
                   style="font-size: 1.25rem; font-weight: 700;">
                    Video to Blog Content
                </a>

                <h1>Create an Account</h1>
                <p>Register to turn your videos into blog content.</p>
            </header>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="reg-name">
                        Full Name
                    </label>

                    <input
                        class="form-control"
                        type="text"
                        id="reg-name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                    <small
                        id="reg-name-error"
                        class="form-error">
                       
                    </small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">
                        Email Address
                    </label>

                    <input
                        class="form-control"
                        type="email"
                        id="reg-email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                    <small
                        id="reg-email-error"
                        class="form-error">
                        
                    </small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">
                        Password
                    </label>

                    <input
                        class="form-control"
                        type="password"
                        id="reg-password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <small
                        id="reg-password-error"
                        class="form-error">
                        
                    </small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-confirm-password">
                        Confirm Password
                    </label>

                    <input
                        class="form-control"
                        type="password"
                        id="reg-confirm-password"
                        name="confirm-password"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >

                    <small
                        id="reg-confirm-password-error"
                        class="form-error">
                    </small>
                </div>

                <button
                    type="submit"
                    id="register-submit-btn"
                    class="btn btn-primary btn-block">
                    Create Account
                </button>
            </form>

            <footer class="auth-footer">
                Already have an account?
                <a href="login.html">Log in</a>
            </footer>

        </section>
    </main>

    <script src="app.js"></script>
    <script src="auth.js"></script>
</body>
</html>
